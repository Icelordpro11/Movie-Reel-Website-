<VirtualHost *:80>
    ServerName movies.local
    DocumentRoot /var/www/reelmovies

    <Directory /var/www/reelmovies>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Keep server-side code and DB scripts out of the public path.
    <DirectoryMatch "/var/www/reelmovies/(db|api/lib)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/movies-error.log
    CustomLog ${APACHE_LOG_DIR}/movies-access.log combined
</VirtualHost>
